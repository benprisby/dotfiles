# Prefix: Ctrl-Space, since herdr uses Ctrl-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal: true color, Neovim-friendly Escape and focus events, clipboard via OSC 52 (works over SSH)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -s escape-time 0
set -g focus-events on
set -s set-clipboard on

# Behavior
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and windows open in the current directory; h/j/k/l move between panes like herdr
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Copy mode with vi keys: v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar in VS Code Dark+ colors
set -g status-style "bg=#1e1e1e,fg=#cccccc"
set -g status-left "#[fg=#569cd6,bold] #S #[default]"
set -g status-right "#[fg=#808080]#H "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#264f78,bold] #I:#W #[default]"
set -g pane-border-style "fg=#3c3c3c"
set -g pane-active-border-style "fg=#569cd6"
set -g message-style "bg=#264f78,fg=#ffffff"
